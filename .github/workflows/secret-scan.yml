# ---------------------------------------------------------------------------
# secret-scan.yml            Template version: 1.0.0
#
# WHAT IT DOES
#   Runs gitleaks to find committed secrets (API keys, tokens, private keys).
#     - push / pull_request: scans only the commits that were pushed or
#       proposed (fast, a few seconds).
#     - weekly schedule / manual run: scans the FULL git history.
#   Findings are printed redacted, so the log of a public repo does not leak
#   the secret a second time.
#
# SUITS
#   Every repo. Most important for public repos and for private repos on a
#   personal account, where GitHub's own secret scanning is not available.
#   Note: this runs AFTER the push. Pair it with hooks/pre-commit, which
#   catches the secret before it leaves the machine.
#
# WHY NOT THE gitleaks/gitleaks-action
#   The action is under a proprietary licence since v2 (the repo itself is
#   MIT). It needs no key on a personal account, but it needs a licence key
#   as soon as a repo lives in an organisation, so it would break on a move.
#   It also wants extra permissions to comment on pull requests. This
#   template downloads the MIT-licensed gitleaks release binary instead and
#   checks it against a pinned SHA-256. No licence, no key, no secrets,
#   `contents: read` only, and one third-party dependency less.
#
# WHAT TO ADJUST
#   - Copy gitleaks.toml (this library) to the repo root to add an allowlist.
#     Without it the default rules apply.
#   - GITLEAKS_VERSION and GITLEAKS_SHA256 below. To bump: take the new
#     version's `gitleaks_<version>_linux_x64.tar.gz` line from the
#     `gitleaks_<version>_checksums.txt` file on the release page. Dependabot
#     does not track this, so check about twice a year.
#   - The cron time, if you want another day.
#
# NOTES
#   - permissions: contents: read is enough. Nothing is written back.
#   - Pushes are never cancelled (each push gets its own concurrency group),
#     because every push scans its own range of commits and a cancelled run
#     would leave a gap. Pull request runs are cancelled when superseded.
#   - Scheduled workflows run on the default branch only, and GitHub pauses
#     them after 60 days without repo activity in public repos.
#   - On a push of a new branch, or after a force push, the previous commit
#     is not usable as a range start. The job then scans the last 200 commits;
#     the weekly full scan covers the rest.
# ---------------------------------------------------------------------------
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--no-banner --redact --verbose --exit-code 1)
          if [ -f gitleaks.toml ]; then
            args+=(--config gitleaks.toml)
          fi

          case "$EVENT_NAME" in
            pull_request)
              echo "Scanning commits of this pull request: ${PR_BASE}..${PR_HEAD}"
              args+=(--log-opts="${PR_BASE}..${PR_HEAD}")
              ;;
            push)
              zero="0000000000000000000000000000000000000000"
              if [ "$PUSH_BEFORE" != "$zero" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                echo "Scanning pushed commits: ${PUSH_BEFORE}..${HEAD_SHA}"
                args+=(--log-opts="${PUSH_BEFORE}..${HEAD_SHA}")
              else
                echo "New branch or force push: scanning the last 200 commits of ${HEAD_SHA}"
                args+=(--log-opts="--max-count=200 ${HEAD_SHA}")
              fi
              ;;
            *)
              echo "Scanning the full history ($EVENT_NAME)"
              ;;
          esac

          gitleaks git "${args[@]}" .
